[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for CAPM equity evaluation and multi-asset portfolio optimization."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
# The backend is an application, not a distributable library.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["online: contacts live data sources (run with --run-online)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Report prose and table templates read better unwrapped.
"app/data_pipeline/markdown_report.py" = ["E501", "RUF001"]
